<!-- Hero Area Start-->
<div class="slider-area ">
    <div class="single-slider section-overly slider-height2 d-flex align-items-center"
        data-background="/User/assets/img/hero/about.jpg">
        <div class="container">
            <div class="row">
                <div class="col-xl-12">
                    <div class="hero-cap text-center">
                        <h2>Get your job</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Hero Area End -->
<!-- Job List Area Start -->
<div class="job-listing-area pt-120 pb-120">
    <div class="container">
        <div class="row">
            <!-- Left content -->
           
            <!-- Right content -->
            <div class="col-xl-12 col-lg-12 col-md-12">
                <!-- Featured_job_start -->
                <section class="featured-job-area">
                    <div class="container-fluid">
                        <!-- Count of Job list Start -->
                      
                        <!-- Count of Job list End -->
                        <!-- single-job-content -->
                        @for (item of ListofJobs(); track item.jobId) {
                        <div class="single-job-items mb-30">
                            <div class="job-items">
                                <div class="company-img">
                                    <a [routerLink]="['/user/job-details', item.jobId]"><img
                                            [src]="'https://localhost:7147' + item.campusLogoUrl" width="85px"
                                            class="border border-primary" alt=""></a>
                                </div>
                                <div class="job-tittle">
                                    <a [routerLink]="['/user/job-details', item.jobId]">
                                        <h4>{{item.jobTitle}}</h4>
                                    </a>
                                    <ul>
                                        <li>{{item.departmentName}}</li>
                                        <li><i class="fas fa-map-marker-alt"></i>{{item.campusName}}</li>
                                        <li>{{item.salary}}</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="items-link f-right">
                                <a [routerLink]="['/user/job-details', item.jobId]">{{item.employmentStatus}}</a>
                                <span>{{item.publishedOn | date}}</span>
                            </div>
                        </div>
                        }
                    </div>
                </section>
                <!-- Featured_job_end -->
            </div>
        </div>
    </div>
</div>
<!-- Job List Area End -->
<!--Pagination Start  -->

        <div class="row">
            <div class="col-xl-12">
                <div class="single-wrap d-flex justify-content-center">
                    <nav aria-label="Page navigation example">
                        <ul class="pagination justify-content-start">
                            <li class="page-item active"><a class="page-link" href="#">01</a></li>
                            <li class="page-item"><a class="page-link" href="#">02</a></li>
                            <li class="page-item"><a class="page-link" href="#">03</a></li>
                            <li class="page-item"><a class="page-link" href="#"><span class="ti-angle-right"></span></a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
<!--Pagination End  -->
